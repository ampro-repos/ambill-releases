name: License Request
description: Request or renew an ambill license for this installation
title: "License Request — [fill in company name]"
labels: ["license-request"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this opens a request that Ambill Support reviews and approves
        manually — nothing is issued automatically. **After submitting, please
        call Ambill Support so they know to check for it now.**
  - type: input
    id: company_name
    attributes:
      label: Company Name
      description: The company name this ambill installation is registered to
    validations:
      required: true
  - type: input
    id: contact_person
    attributes:
      label: Contact Person
    validations:
      required: true
  - type: input
    id: contact_phone
    attributes:
      label: Contact Phone
    validations:
      required: true
  - type: input
    id: machine_uid
    attributes:
      label: Machine ID
      description: Auto-filled by the ambill Activate License screen — do not edit
      placeholder: XXXX-XXXX-XXXX-XXXX
    validations:
      required: true
  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      options:
        - New Activation
        - Renewal
        - Switched Computer
    validations:
      required: true
  - type: input
    id: previous_machine_uid
    attributes:
      label: Previous Machine ID (only if switching computers)
      description: Leave blank unless this replaces an earlier activation on a different computer — filling this in retires that old machine's license once approved.
      placeholder: XXXX-XXXX-XXXX-XXXX
    validations:
      required: false
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - ambill
        - amfreezer
      default: 0
    validations:
      required: true
  - type: dropdown
    id: license_type
    attributes:
      label: Requested License Type
      options:
        - Paid
        - Trial
      default: 0
    validations:
      required: true
  - type: input
    id: expiry_days
    attributes:
      label: Requested Expiry (days from approval)
      placeholder: "365"
    validations:
      required: true
  - type: dropdown
    id: payment_required
    attributes:
      label: Payment Required
      description: Admin-set only — leave as No, this isn't something the customer decides.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: input
    id: payment_amount
    attributes:
      label: Payment Amount (INR)
      description: Only used if Payment Required is Yes.
      placeholder: "5000"
    validations:
      required: false
  - type: dropdown
    id: payment_provider
    attributes:
      label: Payment Provider
      description: >-
        Admin-set only. UPI QR shows a QR code for your personal UPI ID(s) inside the app —
        no automatic verification, so you confirm the payment yourself (bank/UPI app) and
        then flip Payment Required back to No to release the license. Razorpay auto-verifies
        via its API (needs RAZORPAY_KEY_ID/RAZORPAY_KEY_SECRET secrets set on this repo).
      options:
        - UPI QR
        - Razorpay
      default: 0
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        **Ambill Support:** the fields above are the customer's request — before
        approving, you can edit this issue (product, license type, expiry, and
        whether payment is required + the amount + provider) to whatever you're
        actually granting. Whatever is in the issue at the moment you approve is
        what determines what happens next — signed immediately, or a payment QR
        / link generated first if Payment Required is Yes.
