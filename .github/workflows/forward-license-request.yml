name: Forward License Request

# This repo is public and binaries-only — it never sees the signing key. All it does is
# parse the structured request and hand it off (via repository_dispatch) to the private
# ampro-apps source repo, where the actual signing workflow lives behind an approval gate.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  forward:
    if: contains(github.event.issue.labels.*.name, 'license-request')
    runs-on: ubuntu-latest
    steps:
      - name: Parse form fields and retitle issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function field(label) {
              const re = new RegExp("### " + label + "\\s*\\n\\s*\\n([^\\n]*)");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            const companyName   = field("Company Name");
            const contactPerson = field("Contact Person");
            const contactPhone  = field("Contact Phone");
            const machineUid    = field("Machine ID");
            const requestType   = field("Request Type");

            if (!companyName || !machineUid) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: "Could not read this request — Company Name and Machine ID are required. Please close this and submit again using the License Request form."
              });
              core.setFailed("Missing required fields");
              return;
            }

            const newTitle = `License Request — ${companyName} (UID: ${machineUid})`;
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              title: newTitle
            });

            core.setOutput('company_name', companyName);
            core.setOutput('contact_person', contactPerson);
            core.setOutput('contact_phone', contactPhone);
            core.setOutput('machine_uid', machineUid);
            core.setOutput('request_type', requestType);

      - name: Forward to ampro-apps for approval + signing
        if: steps.parse.outputs.machine_uid != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'ampro-repos',
              repo: 'ampro-apps',
              event_type: 'license-request',
              client_payload: {
                issue_number: context.issue.number,
                company_name: '${{ steps.parse.outputs.company_name }}',
                contact_person: '${{ steps.parse.outputs.contact_person }}',
                contact_phone: '${{ steps.parse.outputs.contact_phone }}',
                machine_uid: '${{ steps.parse.outputs.machine_uid }}',
                request_type: '${{ steps.parse.outputs.request_type }}'
              }
            });

      - name: Acknowledge receipt
        if: steps.parse.outputs.machine_uid != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Request received and sent for approval. **Please call Ambill Support now so they can review and approve it.** This issue will get a comment with the license once it's approved."
            });
