name: License Signing

# IssueOps: a customer's ambill app opens a structured License Request issue (see
# .github/ISSUE_TEMPLATE/license-request.yml). This workflow parses it, waits for manual
# approval on a protected environment, then signs a real license using the pre-built
# LicenseSigningCLI tool committed under tools/LicenseSigningCLI/ (binary only — its source
# lives in the private ampro-apps repo). The signing key only ever exists as this
# environment's secrets, never in the shipped app.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write   # needed to commit revoked-uids.json when a request switches computers

jobs:
  parse:
    if: contains(github.event.issue.labels.*.name, 'license-request')
    runs-on: ubuntu-latest
    outputs:
      company_name: ${{ steps.parse.outputs.company_name }}
      machine_uid: ${{ steps.parse.outputs.machine_uid }}
    steps:
      - name: Parse form fields and retitle issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function field(label) {
              // [ \t]* not \s* before each newline — \s* also matches newlines, so on a field
              // with an empty value followed by extra blank lines it greedily swallows past
              // them and misreads the NEXT "### Label" header as this field's value. Confirmed
              // live: an empty Previous Machine ID rendered as "### Product" elsewhere.
              const re = new RegExp("### " + label + "[ \\t]*\\r?\\n[ \\t]*\\r?\\n([^\\r\\n]*)");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            const companyName = field("Company Name");
            const machineUid  = field("Machine ID");

            if (!companyName || !machineUid) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: "Could not read this request — Company Name and Machine ID are required. Please close this and submit again using the License Request form."
              });
              core.setFailed("Missing required fields");
              return;
            }

            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              title: `License Request — ${companyName} (UID: ${machineUid})`
            });

            // The ambill app posts a raw issue body via the API (Company Name / Contact
            // Person / Contact Phone / Machine ID / Request Type only) — it never goes
            // through the Issue Form template, so Product/License Type/Expiry/Payment
            // fields never exist in the body at all, leaving Ambill Support nothing to
            // edit before approving. Append them here (with defaults) whenever missing,
            // so every request — app-submitted or manually created via the web form —
            // ends up with the same editable set of fields.
            // [ \t]* (not \s*) before each newline — \s* also matches newlines, so appending
            // "\n\n### Label\n\n" + "" (an empty default) directly before the next field's own
            // leading "\n\n### NextLabel" compounds into multiple blank lines, and a \s*-based
            // reader elsewhere (parsing this same convention) greedily swallows straight past
            // them and misreads the NEXT header as this field's value. Confirmed live on a real
            // issue: an empty "Previous Machine ID" ended up rendered as "### Product".
            function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
            function hasField(label) {
              return new RegExp("### " + escapeRegex(label) + "[ \\t]*\\r?\\n[ \\t]*\\r?\\n").test(body);
            }

            const adminDefaults = [
              ["Previous Machine ID (only if switching computers)", ""],
              ["Product", "ambill"],
              ["Requested License Type", "Paid"],
              ["Requested Expiry (days from approval)", "365"],
              ["Payment Required", "No"],
              ["Payment Amount (INR)", ""],
              ["Payment Provider", "UPI QR"],
            ];
            // Join with a single "\n\n" between sections regardless of which values are
            // empty, instead of letting each field's own leading/trailing "\n\n" stack up.
            const missingSections = adminDefaults
              .filter(([label]) => !hasField(label))
              .map(([label, def]) => `### ${label}\n\n${def}`);
            if (missingSections.length) {
              const appended = "\n\n" + missingSections.join("\n\n");
              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                body: body.replace(/\s*$/, "") + appended + "\n"
              });
            }

            // A uid:<hash> label lets the app itself (and this repo's own tooling) find every
            // issue tied to a given machine via the regular issues-list endpoint
            // (?labels=uid:<hash>) — the same fp:<hash> dedup technique already used by the
            // ambill-error-reports crash-reporting pipeline, not the far tighter Search API.
            // This is what lets the client recover an already-issued license after a reinstall,
            // and lets it silently pick up a later renewal/extension of the same machine's
            // license without filing a new request each time. Added here (not by the client at
            // creation) so every issue gets one regardless of how it was created — the app's
            // raw POST or a manually-filed one via the web form — and so it's computed once,
            // consistently, in the one place server-side that already normalizes every issue.
            const crypto = require('crypto');
            const uidHash = crypto.createHash('sha256').update(machineUid).digest('hex').slice(0, 8);
            const uidLabel = `uid:${uidHash}`;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [uidLabel]
            });

            core.setOutput('company_name', companyName);
            core.setOutput('machine_uid', machineUid);

      - name: Acknowledge receipt
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Request received. **Please call Ambill Support now so they can review and approve it.**\n\n" +
                "**Before approving:** click the ✏️ (edit) icon at the top of this issue to change Product, " +
                "Requested License Type (Paid/Trial), Requested Expiry, Payment Required/Amount/Provider, or " +
                "Previous Machine ID (only if switching computers) — whatever is in the issue body at the " +
                "moment you approve the deployment below is what actually gets signed.\n\n" +
                "This issue will get a comment with the license once it's approved."
            });

  sign:
    needs: parse
    runs-on: windows-latest
    environment: license-signing   # pauses here until a required reviewer approves
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Re-reads the issue FRESH at this point (not the `parse` job's earlier snapshot) —
      # Ambill Support can edit Product / Requested License Type / Requested Expiry (or
      # even Machine ID) on the issue any time before approving, and whatever is there the
      # moment this step runs — after approval — is what actually gets signed.
      - name: Read current issue fields
        id: fields
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const body = issue.data.body || "";

            function field(label) {
              // [ \t]* not \s* before each newline — \s* also matches newlines, so on a field
              // with an empty value followed by extra blank lines it greedily swallows past
              // them and misreads the NEXT "### Label" header as this field's value. Confirmed
              // live: an empty Previous Machine ID rendered as "### Product" elsewhere.
              const re = new RegExp("### " + label + "[ \\t]*\\r?\\n[ \\t]*\\r?\\n([^\\r\\n]*)");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            const machineUid  = field("Machine ID");
            const product     = field("Product") || "ambill";
            const licenseType = field("Requested License Type") || "Paid";
            let expiryDays    = parseInt(field("Requested Expiry \\(days from approval\\)"), 10);
            if (!expiryDays || expiryDays <= 0) expiryDays = 365;
            const previousUid = field("Previous Machine ID \\(only if switching computers\\)");
            const paymentRequired = field("Payment Required").trim().toLowerCase() === 'yes';
            const paymentAmount = field("Payment Amount \\(INR\\)");
            const paymentProvider = field("Payment Provider") || "UPI QR";

            core.setOutput('machine_uid', machineUid);
            core.setOutput('product', product);
            core.setOutput('is_trial', licenseType.trim().toLowerCase() === 'trial' ? 'true' : 'false');
            core.setOutput('expiry_days', String(expiryDays));
            core.setOutput('previous_uid', previousUid);
            core.setOutput('payment_required', paymentRequired ? 'true' : 'false');
            core.setOutput('payment_amount', paymentAmount);
            core.setOutput('payment_provider', paymentProvider);
            core.setOutput('company_name', ${{ toJson(needs.parse.outputs.company_name) }});

      # Payment not required (the default/original path) — sign immediately, same as before.
      - name: Sign license
        if: steps.fields.outputs.payment_required != 'true'
        id: sign
        env:
          LICENSE_SIGNING_PFX_BASE64: ${{ secrets.LICENSE_SIGNING_PFX_BASE64 }}
          LICENSE_SIGNING_PFX_PASSWORD: ${{ secrets.LICENSE_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $uid = "${{ steps.fields.outputs.machine_uid }}"
          $product = "${{ steps.fields.outputs.product }}"
          $expiryDays = "${{ steps.fields.outputs.expiry_days }}"
          $isTrial = "${{ steps.fields.outputs.is_trial }}" -eq "true"
          $exe = "tools\LicenseSigningCLI\LicenseSigningCLI.exe"

          $cliArgs = @("--uid", $uid, "--appname", $product, "--expiry-days", $expiryDays)
          if ($isTrial) { $cliArgs += "--trial" }

          $licenseString = & $exe @cliArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signing failed: $licenseString"
            exit 1
          }

          # GITHUB_OUTPUT, not the log, so the license string itself is never printed anywhere
          "license_string=$licenseString" >> $env:GITHUB_OUTPUT

      # UPI QR (default) — build the payment deep links directly, no external API call needed.
      # Stops here just like the Razorpay path below: nothing gets signed in this run. Unlike
      # Razorpay there's no API to auto-verify a personal UPI payment, so Ambill Support
      # confirms it themselves (their own bank/UPI app) and flips Payment Required back to No —
      # the scheduled Payment Verification sweep picks that edit up and signs directly.
      - name: Generate UPI payment QR data
        if: steps.fields.outputs.payment_required == 'true' && steps.fields.outputs.payment_provider != 'Razorpay'
        id: upiqr
        uses: actions/github-script@v7
        with:
          script: |
            const amountRupees = parseInt("${{ steps.fields.outputs.payment_amount }}", 10);
            if (!amountRupees || amountRupees <= 0) {
              core.setFailed("Payment Amount (INR) must be a positive number.");
              return;
            }

            // Your own personal UPI IDs — not secrets, this is exactly what's shown on any
            // payment QR code to whoever scans it. Update here if either ever changes.
            const providers = [
              { label: "GPay", vpa: "mahanteshankalakoti@okicici" },
              { label: "PhonePe", vpa: "8088677370@axl" }
            ];

            const payeeName = encodeURIComponent("Ambill");
            const note = encodeURIComponent(`Ambill-${context.issue.number}`);

            function upiLink(vpa) {
              return `upi://pay?pa=${encodeURIComponent(vpa)}&pn=${payeeName}&am=${amountRupees}&cu=INR&tn=${note}`;
            }

            core.setOutput('upi_link_gpay', upiLink(providers[0].vpa));
            core.setOutput('upi_link_phonepe', upiLink(providers[1].vpa));
            core.setOutput('payment_reference', `UPI-${context.issue.number}`);

      # Payment required + provider is Razorpay — generate a Razorpay payment link and stop
      # here. Nothing gets signed in this run; the scheduled Payment Verification workflow
      # independently confirms payment directly against Razorpay's own API (not this app's
      # say-so) before ever signing, so no second manual approval is needed once payment clears.
      - name: Generate payment link
        if: steps.fields.outputs.payment_required == 'true' && steps.fields.outputs.payment_provider == 'Razorpay'
        id: paylink
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        shell: pwsh
        run: |
          $amountRupees = [int]"${{ steps.fields.outputs.payment_amount }}"
          if ($amountRupees -le 0) { Write-Error "Payment Amount (INR) must be a positive number."; exit 1 }
          $amountPaise = $amountRupees * 100

          $authBytes = [System.Text.Encoding]::UTF8.GetBytes("${env:RAZORPAY_KEY_ID}:${env:RAZORPAY_KEY_SECRET}")
          $authHeader = "Basic " + [Convert]::ToBase64String($authBytes)

          $body = @{
            amount          = $amountPaise
            currency        = "INR"
            description     = "ambill license - ${{ steps.fields.outputs.company_name }}"
            callback_url    = "https://ambill-app.local/payment-complete"
            callback_method = "get"
            notify          = @{ sms = $false; email = $false }
          } | ConvertTo-Json

          $response = Invoke-RestMethod -Uri "https://api.razorpay.com/v1/payment_links" -Method Post `
            -Headers @{ Authorization = $authHeader } -ContentType "application/json" -Body $body

          "payment_link_id=$($response.id)" >> $env:GITHUB_OUTPUT
          "payment_link_url=$($response.short_url)" >> $env:GITHUB_OUTPUT

      - name: Post payment link on the issue
        if: steps.fields.outputs.payment_required == 'true' && steps.fields.outputs.payment_provider == 'Razorpay'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const newBody = (issue.data.body || "") +
              "\n\n### Payment Link\n\n${{ steps.paylink.outputs.payment_link_url }}\n\n" +
              "### Payment Link ID\n\n${{ steps.paylink.outputs.payment_link_id }}\n\n" +
              "### Payment Reference\n\n${{ steps.paylink.outputs.payment_link_id }}\n";

            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, body: newBody });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Payment required to complete this request — **₹${{ steps.fields.outputs.payment_amount }}**.\n\n" +
                "Pay here: ${{ steps.paylink.outputs.payment_link_url }}\n\n" +
                "Your license will be issued automatically once payment is confirmed (may take a few minutes)."
            });

      - name: Post UPI payment QR data on the issue
        if: steps.fields.outputs.payment_required == 'true' && steps.fields.outputs.payment_provider != 'Razorpay'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const newBody = (issue.data.body || "") +
              "\n\n### Payment UPI Link (GPay)\n\n${{ steps.upiqr.outputs.upi_link_gpay }}\n\n" +
              "### Payment UPI Link (PhonePe)\n\n${{ steps.upiqr.outputs.upi_link_phonepe }}\n\n" +
              "### Payment Reference\n\n${{ steps.upiqr.outputs.payment_reference }}\n";

            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, body: newBody });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Payment required to complete this request — **₹${{ steps.fields.outputs.payment_amount }}**.\n\n" +
                "Open the ambill Activate License screen and tap Pay Now to see the QR code, or scan/pay directly using the links posted on this issue.\n\n" +
                "Ambill Support will confirm the payment manually and release the license — this may take a while."
            });

      # Best-effort: a hiccup here (e.g. a push race with another concurrent approval) must
      # never block the customer actually getting their new license below — but a silent
      # failure here means the old machine never actually gets revoked with zero trace
      # anywhere, so this step reports its own outcome for the follow-up step below to act on.
      - name: Revoke previous machine (if switching computers)
        id: revoke
        if: >-
          steps.fields.outputs.payment_required != 'true' &&
          steps.fields.outputs.previous_uid != '' &&
          steps.fields.outputs.previous_uid != steps.fields.outputs.machine_uid
        continue-on-error: true
        shell: pwsh
        run: |
          $prevUid = "${{ steps.fields.outputs.previous_uid }}"
          $listPath = "revoked-uids.json"
          $revokedAt = (Get-Date).ToUniversalTime().ToString("o")

          $list = @()
          if (Test-Path $listPath) {
            $raw = Get-Content $listPath -Raw
            if ($raw.Trim().Length -gt 0) { $list = @(ConvertFrom-Json $raw) }
          }
          $list += [PSCustomObject]@{ uid = $prevUid; revokedAt = $revokedAt; reason = "Switched to a new computer" }
          $list | ConvertTo-Json -Depth 3 | Set-Content $listPath

          git config user.name "ambill-license-bot"
          git config user.email "actions@github.com"
          git add $listPath

          # A concurrent approval could have pushed in between — one retry after re-pulling
          # covers that; anything past that surfaces via the follow-up step instead of retrying
          # forever.
          git commit -m "Revoke UID $prevUid (superseded by a new activation)"
          git push
          if ($LASTEXITCODE -ne 0) {
            git pull --rebase
            git push
            if ($LASTEXITCODE -ne 0) { throw "Could not push revoked-uids.json after retry" }
          }

      # Guards against approving a switch where "Previous Machine ID" was accidentally left
      # as the SAME machine the new license is for — revoking it here would lock out the
      # customer the moment their app checks, immediately after being approved. Flag it
      # instead of silently acting on what's almost certainly a copy-paste mistake.
      - name: Flag same-machine revocation mistake
        if: >-
          steps.fields.outputs.payment_required != 'true' &&
          steps.fields.outputs.previous_uid != '' &&
          steps.fields.outputs.previous_uid == steps.fields.outputs.machine_uid
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "⚠️ Previous Machine ID matches the Machine ID being licensed — skipped revocation since that would lock out the customer you just approved. If this was meant to revoke a genuinely different machine, please correct the field and re-approve."
            });

      # Only fires if the revoke step above actually ran and failed after its retry — makes an
      # otherwise-silent loss of the revocation visible instead of leaving no trace anywhere.
      - name: Flag failed revocation
        if: steps.revoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "⚠️ The new license below was issued, but retiring the previous machine's license failed (couldn't save revoked-uids.json). That old machine has NOT been revoked — please retry the switch manually or add it to revoked-uids.json by hand."
            });

      - name: Post license back on the issue and close it
        if: steps.fields.outputs.payment_required != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const licenseString = `${{ steps.sign.outputs.license_string }}`;
            const product = `${{ steps.fields.outputs.product }}`;
            const expiryDays = `${{ steps.fields.outputs.expiry_days }}`;
            const isTrial = `${{ steps.fields.outputs.is_trial }}` === 'true';

            const previousUid = `${{ steps.fields.outputs.previous_uid }}`;
            let summary = `Product: **${product}** · Type: **${isTrial ? 'Trial' : 'Paid'}** · Expires in **${expiryDays} days** from today.`;
            if (previousUid) summary += `\n\nPrevious machine (\`${previousUid}\`) has been retired and will invalidate next time it's online.`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Your license has been approved and generated.\n\n" + summary + "\n\n```\n" + licenseString + "\n```\n\nPaste this into the ambill Activate License screen if it doesn't fill in automatically."
            });

            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
